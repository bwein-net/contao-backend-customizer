name: contao-backend-customizer

services:
    appserver:
        type: php:8.2
        via: cli
        overrides:
            extra_hosts:
                - ${LANDO_HOST_IP_DEV:-host}:host-gateway
            environment:
                PHP_IDE_CONFIG: "serverName=lando"
                COMPOSER_CACHE_DIR: "/lando/composer_cache"
                XDEBUG_SESSION_START: lando
            volumes:
                - /app/vendor
                - ./vendor:/host_vendor
    node:
        type: node:26
        via: cli

tooling:
    composer:
        service: appserver
        cmd: composer

    vendor-sync:
        service: appserver
        description: Sync vendor to host
        cmd:
            - echo "Sync vendor to host..."
            - rsync -rtzL --delete --info=progress2 /app/vendor/ /host_vendor/

    ecs:
        service: appserver
        cmd: composer ecs

    npm:
        service: node
        description: Run npm commands

    assets:
        service: node
        description: Build the minified css and js files
        cmd: npm run --silent build

    assets-watch:
        service: node
        description: Rebuild the minified css and js files on changes
        cmd: npm run --silent watch
